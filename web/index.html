<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Sync - swap skills with students</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/" aria-label="Skill Sync home">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">

    <nav id="nav" aria-label="Main"></nav>

  <main id="app" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>
